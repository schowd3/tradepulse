apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradepulse-grafana
  namespace: tradepulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradepulse-grafana
  template:
    metadata:
      labels:
        app: tradepulse-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboard
              mountPath: /var/lib/grafana/dashboards
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: grafana-datasource
          configMap:
            name: tradepulse-grafana-datasource
        - name: grafana-dashboard-provider
          configMap:
            name: tradepulse-grafana-dashboard-provider
        - name: grafana-dashboard
          configMap:
            name: tradepulse-grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: tradepulse-grafana
  namespace: tradepulse
spec:
  selector:
    app: tradepulse-grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000