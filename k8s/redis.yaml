apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradepulse-redis
  namespace: tradepulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradepulse-redis
  template:
    metadata:
      labels:
        app: tradepulse-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tradepulse-redis
  namespace: tradepulse
spec:
  selector:
    app: tradepulse-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379