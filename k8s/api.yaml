apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradepulse-api
  namespace: tradepulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradepulse-api
  template:
    metadata:
      labels:
        app: tradepulse-api
    spec:
      containers:
        - name: api
          image: tradepulse-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://tradepulse_user:tradepulse_pass@tradepulse-postgres:5432/tradepulse_db
            - name: REDIS_URL
              value: redis://tradepulse-redis:6379/0
---
apiVersion: v1
kind: Service
metadata:
  name: tradepulse-api
  namespace: tradepulse
spec:
  type: NodePort
  selector:
    app: tradepulse-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080